rules:
  action-setup: done
  appropriate-polling:
    status: done
    comment: "Price data is fetched about 2-3 times per day on a schedule; no per-minute polling."
  brands:
    status: done
    comment: "Brand images are in the brand directory."
  common-modules:
    status: todo
    comment: "coordinator.py exists; there is no shared entity.py, and the entity base class lives in sensor.py."
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: "config_flow.py coverage is 57%."
  dependency-transparency:
    status: todo
    comment: "kilowahti is on PyPI under MIT but is built and uploaded by hand with twine; kilowahti-py has no CI publish workflow."
  docs-actions:
    status: done
    comment: "docs.kilowahti.fi/services documents every service."
  docs-conditions:
    status: done
    comment: "docs.kilowahti.fi/triggers-conditions covers the conditions."
  docs-high-level-description:
    status: done
    comment: "docs.kilowahti.fi/index describes the integration and its supported regions."
  docs-installation-instructions:
    status: todo
    comment: "Needs the Marketplace wording from Home Assistant 2026.11."
  docs-removal-instructions:
    status: todo
    comment: "No removal section in the docs."
  docs-triggers:
    status: done
    comment: "docs.kilowahti.fi/triggers-conditions covers the triggers."
  entity-event-setup:
    status: exempt
    comment: "Entities do not subscribe to events; the coordinator owns all listeners and timers."
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: "The coordinator is stored on entry.runtime_data."
  test-before-configure:
    status: exempt
    comment: "No host or credentials. Prices come from public sources with a fallback chain, so a connection test in the flow adds nothing."
  test-before-setup:
    status: done
    comment: "The first price fetch raises ConfigEntryNotReady on failure."
  unique-config-entry:
    status: done
    comment: "The entry name is the unique ID."
  action-exceptions:
    status: done
    comment: "Service handlers raise ServiceValidationError."
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: "docs.kilowahti.fi/configuration covers every option, including updating settings."
  docs-installation-parameters:
    status: done
    comment: "docs.kilowahti.fi/configuration walks through every setup step."
  entity-unavailable:
    status: todo
    comment: "Relies on the CoordinatorEntity default; not checked against the rule."
  integration-owner:
    status: done
    comment: "codeowners is set in the manifest."
  log-when-unavailable:
    status: todo
    comment: "Source failures are logged on every fetch; there is no log-once on unavailable and on recovery."
  parallel-updates:
    status: done
    comment: "PARALLEL_UPDATES is declared on every platform."
  reauthentication-flow:
    status: exempt
    comment: "No authentication."
  test-coverage:
    status: todo
    comment: "Total coverage is 82% against the 95% target."
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: "Cloud price data; there is nothing to discover on the network."
  discovery-update-info:
    status: exempt
    comment: "Cloud price data; there is nothing to discover on the network."
  docs-data-update:
    status: done
    comment: "docs.kilowahti.fi/faq explains the fetch schedule and where prices come from."
  docs-examples:
    status: done
    comment: "docs.kilowahti.fi/automations has worked examples."
  docs-known-limitations:
    status: todo
    comment: "Limitations are spread over the FAQ and troubleshooting pages; there is no single section."
  docs-supported-devices:
    status: exempt
    comment: "No devices are supported; the integration reads public price data."
  docs-supported-functions:
    status: done
    comment: "docs.kilowahti.fi/entities lists every entity."
  docs-troubleshooting:
    status: done
    comment: "docs.kilowahti.fi has a troubleshooting page."
  docs-use-cases:
    status: done
    comment: "docs.kilowahti.fi has a how-do-i page."
  dynamic-devices:
    status: exempt
    comment: "Each config entry has exactly one device."
  entity-category: done
  entity-device-class:
    status: todo
    comment: "device_class is set in only a few places in sensor.py; not audited."
  entity-disabled-by-default:
    status: done
    comment: "Less useful sensors set entity_registry_enabled_default=False."
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: "icons.json covers the entities where the default icon is generic."
  reconfiguration-flow:
    status: done
    comment: "Reconfigure renames the entry. Region, resolution, unit, VAT and the rest are edited in Options."
  repair-issues:
    status: done
    comment: "A repair issue is raised when a fallback price source stays active for over 24 hours."
  stale-devices:
    status: exempt
    comment: "Each config entry has exactly one device."
  async-dependency:
    status: done
    comment: "kilowahti uses aiohttp."
  inject-websession:
    status: done
    comment: "Sources receive the Home Assistant client session."
  strict-typing:
    status: todo
    comment: "Not enabled."
